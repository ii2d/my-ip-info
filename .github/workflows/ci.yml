name: CI & Security Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Run scheduled security audit & SBOM check every Monday at 04:00 UTC (or change to daily '0 4 * * *')
    - cron: '0 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & Format Check (Biome)
        run: pnpm lint

      - name: Typecheck Codebase (TypeScript)
        run: pnpm typecheck

      - name: Run Unit Tests
        run: pnpm test

      - name: Build Frontend & Worker Assets
        run: pnpm build

  security:
    name: Vulnerability & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Full History for Secret Scan)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency Vulnerability Audit (pnpm audit)
        run: pnpm run audit

      - name: Generate CycloneDX SBOM
        run: pnpm sbom --sbom-format cyclonedx --sbom-spec-version 1.6 --sbom-type application --out dist/sbom.cdx.json

      - name: Scan CycloneDX SBOM with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'sbom'
          scan-ref: 'dist/sbom.cdx.json'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
