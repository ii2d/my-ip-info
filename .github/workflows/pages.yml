name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend API URL (overrides vars.VITE_BACKEND_URL)'
        required: false
        type: string
      frontend_domain:
        description: 'Frontend Domain for CNAME (overrides vars.FRONTEND_DOMAIN)'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend for GitHub Pages
        env:
          GITHUB_PAGES: 'true'
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}
          VITE_BACKEND_URL: ${{ inputs.backend_url || vars.VITE_BACKEND_URL || vars.BACKEND_URL || 'https://my-ip-info.ii2d-dev.workers.dev' }}
          VITE_ENABLE_IP2LOCATION: ${{ vars.ENABLE_IP2LOCATION || 'true' }}
          FRONTEND_DOMAIN: ${{ inputs.frontend_domain || vars.FRONTEND_DOMAIN || vars.CUSTOM_DOMAIN || 'ip.ii2d.com' }}
        run: |
          pnpm run build:pages
          cp dist/client/index.html dist/client/404.html
          if [ -n "$FRONTEND_DOMAIN" ] && [ "$FRONTEND_DOMAIN" != "none" ] && [ "$FRONTEND_DOMAIN" != "false" ]; then
            echo "$FRONTEND_DOMAIN" > dist/client/CNAME
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
